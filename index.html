<!doctype html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>婚宴座位表</title>
  <style>
    :root {
      --groom: #2563EB;
      --bride: #B03A2E;
      --ink: #111827;
      --muted: #6b7280;
      --line: #d1d5db;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f3ef;
      color: var(--ink);
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .toolbar .hint {
      font-size: 13px;
      color: var(--muted);
    }

    button {
      font: inherit;
      font-size: 15px;
      background: #1f2937;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
    }

    button:hover {
      background: #374151;
    }

    h1 {
      text-align: center;
      font-size: 26px;
      margin: 0 0 4px;
      letter-spacing: 2px;
    }

    .summary {
      text-align: center;
      font-size: 14px;
      color: #4b5563;
      margin: 0 0 16px;
    }

    .sheet {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
    }

    .map svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 80vh;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      font-size: 13px;
      color: #4b5563;
      margin-top: 10px;
    }

    .legend i {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      vertical-align: -2px;
      margin-right: 5px;
      background: #fff;
    }

    .list {
      columns: 2;
      column-gap: 16px;
      margin-top: 20px;
    }

    .card {
      break-inside: avoid;
      border: 2.5px solid #9ca3af;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      background: #fff;
    }

    .card-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 5px;
      margin-bottom: 6px;
    }

    .card-name {
      font-size: 22px;
      font-weight: 700;
    }

    .card-side {
      font-size: 15px;
      font-weight: 700;
    }

    .card-count {
      margin-left: auto;
      font-size: 16px;
      color: #374151;
      white-space: nowrap;
    }

    .guests {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .guests li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 19px;
      line-height: 1.55;
    }

    .guests .x {
      white-space: nowrap;
      color: #374151;
    }

    .empty {
      font-size: 16px;
      color: #9ca3af;
      margin: 4px 0;
    }

    .note {
      margin-top: 8px;
      border: 1px solid #9ca3af;
      border-radius: 6px;
      min-height: 56px;
      padding: 4px 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .note .chair {
      margin-top: 3px;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
    }

    @media (max-width: 640px) {
      .list {
        columns: 1;
      }

      .sheet {
        padding: 12px;
      }
    }

    @page {
      size: A4;
      margin: 10mm;
    }

    @media print {
      body {
        background: #fff;
      }

      .wrap {
        max-width: none;
        padding: 0;
      }

      .toolbar {
        display: none;
      }

      .sheet {
        box-shadow: none;
        padding: 0;
        border-radius: 0;
      }

      h1 {
        font-size: 20pt;
      }

      .summary {
        font-size: 11pt;
        margin-bottom: 4mm;
      }

      .map {
        break-after: page;
      }

      .map svg {
        max-height: 235mm;
      }

      .list {
        columns: 2;
        column-gap: 6mm;
        margin-top: 0;
      }

      .card {
        border-radius: 3mm;
        padding: 3mm 4mm;
        margin-bottom: 5mm;
      }

      .card-name {
        font-size: 17pt;
      }

      .card-side {
        font-size: 12pt;
      }

      .card-count {
        font-size: 13pt;
      }

      .guests li {
        font-size: 15pt;
      }

      .empty {
        font-size: 13pt;
      }

      .note {
        min-height: 15mm;
        border-radius: 1.5mm;
        font-size: 10pt;
        padding: 1mm 2mm;
      }

      .note .chair {
        font-size: 13pt;
      }
    }
  </style>
</head>

    function renderList() {

    function renderSummary() {
      const nos = DATA.layout.map((l) => l.no)
      const total = nos.reduce((s, n) => s + seated(n), 0)
      const capTotal = nos.reduce((s, n) => s + cap(n), 0)
      const stat = (k) => { const ns = nos.filter((n) => info(n).side === k); return `${SIDE[k].label} ${ns.length} 桌 ${ns.reduce((s, n) => s + seated(n), 0)} 人` }

      document.getElementById('summary').textContent =
        `已安排 ${total} 人／總座位 ${capTotal}・${stat('groom')}・${stat('bride')}・兒童座椅 ${chairs} 張・資料時間 ${DATA.generatedAt}`
    }

    function exportPdf() {
      const d = new Date()
      const p = (n) => String(n).padStart(2, '0')
      const old = document.title
      document.title = `座位表_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}`
      window.addEventListener('afterprint', () => { document.title = old }, { once: true })
      window.print()
    }

    renderMap(); renderList(); renderSummary()
  </script>
