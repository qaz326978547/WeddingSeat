<!doctype html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>婚宴座位表</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Caveat:wght@400&family=LXGW+WenKai+TC&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #EEF1F4;
      --gold: #C2AE7E;
      --gold-deep: #B39E6B;
      --line: #DDE3E8;
      --ink: #1f2328;
      --muted: #7b8086;
      --wine: #8E2A2A;
      --groom: #2563EB;
      --bride: #B03A2E;
      --script: "Great Vibes", "Snell Roundhand", cursive;
      --hand: "Caveat", "Bradley Hand", cursive;
      --zh: "LXGW WenKai TC", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--zh);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .toolbar .hint {
      font-size: 13px;
      color: var(--muted);
      width: 100%;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      flex: 1;
    }

    .search {
      position: relative;
      flex: 1 1 220px;
      max-width: 320px;
    }

    .search input {
      width: 100%;
      font: inherit;
      font-size: 15px;
      padding: 9px 34px 9px 12px;
      border: 1.5px solid var(--gold);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    .search input:focus {
      border-color: var(--gold-deep);
      box-shadow: 0 0 0 3px rgba(194, 174, 126, .25);
    }

    .search .clear {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      color: var(--muted);
      padding: 4px 8px;
      font-size: 18px;
      line-height: 1;
    }

    .search .clear:hover {
      background: none;
      color: var(--ink);
    }

    .seg {
      display: inline-flex;
      border: 1.5px solid var(--gold);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    .seg button {
      background: #fff;
      color: var(--ink);
      border-radius: 0;
      padding: 9px 14px;
    }

    .seg button+button {
      border-left: 1px solid var(--gold);
    }

    .seg button:hover {
      background: #f6f2e8;
    }

    .seg button[aria-pressed="true"] {
      background: var(--gold-deep);
      color: #fff;
    }

    .seg button[data-side="groom"][aria-pressed="true"] {
      background: var(--groom);
    }

    .seg button[data-side="bride"][aria-pressed="true"] {
      background: var(--bride);
    }

    .result {
      font-size: 14px;
      color: var(--muted);
      margin: 0 0 12px;
      text-align: center;
      min-height: 1em;
    }

    mark {
      background: #F8E7B0;
      color: inherit;
      border-radius: 3px;
      padding: 0 2px;
    }

    .card.hit {
      border-color: var(--gold-deep);
      border-width: 2.5px;
    }

    button {
      font: inherit;
      font-size: 15px;
      background: var(--gold-deep);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
    }

    button:hover {
      background: #a08b58;
    }

    .map svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 92vh;
    }

    .list-title {
      text-align: center;
      font-family: var(--script);
      font-size: 44px;
      color: var(--wine);
      font-weight: 400;
      margin: 28px 0 4px;
    }

    .summary {
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      margin: 0 0 18px;
    }

    .list {
      columns: 2;
      column-gap: 16px;
    }

    .card {
      break-inside: avoid;
      background: #fff;
      border: 1.5px solid var(--gold);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 16px;
    }

    .card-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 5px;
      margin-bottom: 6px;
    }

    .card-name {
      font-size: 22px;
      font-weight: 700;
    }

    .card-side {
      font-size: 14px;
      font-weight: 700;
    }

    .card-count {
      margin-left: auto;
      font-size: 16px;
      color: var(--muted);
      white-space: nowrap;
    }

    .guests {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .guests li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 19px;
      line-height: 1.55;
    }

    .guests .x {
      white-space: nowrap;
      color: var(--muted);
    }

    .empty {
      font-size: 16px;
      color: #a3a8ad;
      margin: 4px 0;
    }

    .note {
      margin-top: 8px;
      border: 1px solid var(--gold);
      border-radius: 6px;
      min-height: 56px;
      padding: 4px 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .note .chair {
      margin-top: 3px;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
    }

    @media (max-width: 640px) {
      .list {
        columns: 1;
      }
    }

    @page {
      size: A4;
      margin: 8mm;
    }

    @media print {
      .wrap {
        max-width: none;
        padding: 0;
      }

      .toolbar,
      .result {
        display: none;
      }

      mark {
        background: none;
        padding: 0;
      }

      .map {
        break-after: page;
      }

      .map svg {
        max-height: 275mm;
      }

      .list-title {
        font-size: 30pt;
        margin-top: 0;
      }

      .summary {
        font-size: 11pt;
        margin-bottom: 4mm;
      }

      .list {
        column-gap: 6mm;
      }

      .card {
        border-radius: 3mm;
        padding: 3mm 4mm;
        margin-bottom: 5mm;
      }

      .card-name {
        font-size: 17pt;
      }

      .card-side {
        font-size: 11pt;
      }

      .card-count {
        font-size: 13pt;
      }

      .guests li {
        font-size: 15pt;
      }

      .empty {
        font-size: 13pt;
      }

      .note {
        min-height: 15mm;
        border-radius: 1.5mm;
        font-size: 10pt;
        padding: 1mm 2mm;
      }

      .note .chair {
        font-size: 13pt;
      }
    }
  </style>
</head>

      const hatch = Array.from({ length: 7 }, (_, i) => {
        const x = 50 + i * 19
        return `<line x1="${x}" y1="${1125 + i * 6}" x2="${x - 10}" y2="${1235}" />`
      }).join('')
      document.getElementById('svg').innerHTML = `<svg viewBox="30 0 930 1272" role="img" aria-label="座位站牌圖">
    <rect x="30" y="0" width="930" height="1272" fill="#EEF1F4"/>
    <g fill="none" stroke="${G}" stroke-width="2.2" stroke-linejoin="round">
      <!-- 外牆 -->
      <path d="M258,56 L258,262 Q258,315 205,315 L112,315 Q64,315 64,363 L64,984 L403,984 L403,1070 L495,1070"/>
      <path d="M495,1064 L495,1076 M583,1064 L583,1076"/>
      <path d="M583,1070 L937,1070 L937,131 L751,131 L751,0"/>
      <!-- 舞台 -->
      <path d="M258,56 L652,56 L652,135 Q455,220 258,135"/>
      <!-- 樓梯 -->
      <path d="M30,1115 Q140,1110 218,1188"/>
    </g>
    <g stroke="${G}" stroke-width="2" fill="none">${hatch}</g>
    <text x="455" y="130" text-anchor="middle" font-family="var(--script)" font-size="56" fill="var(--wine)">Stage</text>
    <!-- 廁所 -->
    <rect x="666" y="-6" width="52" height="36" rx="6" fill="none" stroke="${G}" stroke-width="2"/>
    <text x="692" y="22" text-anchor="middle" font-size="22" fill="${G}">🚻</text>
    <path d="M706,128 C700,110 712,98 705,80 C700,66 708,58 707,46 M700,56 L707,44 L713,56" fill="none" stroke="${G}" stroke-width="2"/>
    <!-- 中央裝飾線 -->
    <path d="M478,420 C490,450 468,480 480,510 C492,545 466,575 478,610 C490,645 466,680 478,715 C488,745 476,770 484,786" fill="none" stroke="${G}" stroke-width="4" stroke-linecap="round"/>
    <!-- 柱子 -->
    ${PILLARS.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="27" fill="var(--gold-deep)"/>`).join('')}
    ${tables}
    <!-- Candy Bar -->
    <rect x="641" y="971" width="249" height="84" rx="10" fill="#fff" stroke="#DDE3E8" stroke-width="1.6"/>
    <text x="765" y="1027" text-anchor="middle" font-family="var(--script)" font-size="44" fill="#1f2328">Candy Bar</text>
    <!-- 入口 -->
    <path d="M540,1128 L540,1062 M530,1080 L540,1058 L550,1080" fill="none" stroke="${G}" stroke-width="3" stroke-linejoin="round"/>
    <text x="540" y="1168" text-anchor="middle" font-family="var(--script)" font-size="42" fill="${G}">Entrance</text>
    <!-- 收禮桌、電梯 -->
    <rect x="653" y="1084" width="102" height="84" rx="8" fill="${G}"/>
    <text x="704" y="1117" text-anchor="middle" font-family="var(--zh)" font-size="25" fill="#fff">男方</text>
    <text x="704" y="1152" text-anchor="middle" font-family="var(--zh)" font-size="25" fill="#fff">收禮桌</text>
    <rect x="763" y="1084" width="102" height="84" rx="8" fill="${G}"/>
    <text x="814" y="1117" text-anchor="middle" font-family="var(--zh)" font-size="25" fill="#fff">女方</text>
    <text x="814" y="1152" text-anchor="middle" font-family="var(--zh)" font-size="25" fill="#fff">收禮桌</text>
    <rect x="883" y="1081" width="70" height="191" fill="${G}"/>
    <line x1="883" y1="1145" x2="953" y2="1145" stroke="#fff" stroke-opacity=".5"/>
    <line x1="883" y1="1210" x2="953" y2="1210" stroke="#fff" stroke-opacity=".5"/>
    <text x="918" y="1166" text-anchor="middle" font-family="var(--zh)" font-size="40" fill="#fff">電</text>
    <text x="918" y="1224" text-anchor="middle" font-family="var(--zh)" font-size="40" fill="#fff">梯</text>
  </svg>`
    }

    function renderList() {
      const hits = hitTables()
      const nos = visibleNos().filter((no) => !state.q || hits.has(no))
      const result = document.getElementById('result')
      if (state.q) {
        const n = DATA.guests.filter((g) => inSide(g.t) && isHit(g)).length
        result.textContent = n ? `找到 ${n} 位賓客，在 ${nos.map(base).join('、')}` : '找不到符合的賓客'
      } else result.textContent = ''
      document.getElementById('list').innerHTML = nos.map((no) => {
        const side = SIDE[info(no).side]
        const gs = at(no)
        const chairs = gs.filter((g) => g.chairs > 0)
        const total = chairs.reduce((s, g) => s + g.chairs, 0)
        return `<div class="card${hits.has(no) ? ' hit' : ''}">
      <div class="card-head">
        <span class="card-name">${esc(name(no))}</span>
        ${side ? `<span class="card-side" style="color:${side.color}">${side.label}</span>` : ''}
        <span class="card-count">${seated(no)}/${cap(no)} 人</span>
      </div>
      ${gs.length ? `<ul class="guests">${gs.map((g) => `<li><span>${highlight(g.name)}</span><span class="x">×${g.count}</span></li>`).join('')}</ul>` : '<p class="empty">尚未安排</p>'}
      <div class="note"><div>備註</div>${total ? `<div class="chair">兒童座椅 ${total} 張（${chairs.map((g) => `${esc(g.name)} ${g.chairs}`).join('、')}）</div>` : ''}</div>
    </div>`
      }).join('')
    }

    function renderSummary() {
      const nos = visibleNos()
      const total = nos.reduce((s, n) => s + seated(n), 0)
      const capTotal = nos.reduce((s, n) => s + cap(n), 0)
      const stat = (k) => { const ns = NOS.filter((n) => info(n).side === k); return `${SIDE[k].label} ${ns.length} 桌 ${ns.reduce((s, n) => s + seated(n), 0)} 人` }
      const chairs = DATA.guests.filter((g) => nos.includes(g.t)).reduce((s, g) => s + g.chairs, 0)
      const head = state.side === 'all'
        ? `已安排 ${total} 人／總座位 ${capTotal}・${stat('groom')}・${stat('bride')}`
        : `${SIDE[state.side].label}名單：主桌＋${nos.filter((n) => n !== 0).length} 桌・已安排 ${total} 人／總座位 ${capTotal}`
      document.getElementById('summary').textContent = `${head}・兒童座椅 ${chairs} 張・資料時間 ${DATA.generatedAt}`
      document.querySelector('.list-title').textContent = state.side === 'all' ? 'Seating List' : state.side === 'groom' ? "Groom's Guests" : "Bride's Guests"
      document.getElementById('pdfBtn').textContent = state.side === 'all' ? '匯出 PDF' : `匯出 PDF（${SIDE[state.side].label}）`
    }

    function exportPdf() {
      const d = new Date()
      const p = (n) => String(n).padStart(2, '0')
      const old = document.title
      const keepQ = state.q
      state.q = ''
      render()
      const tag = state.side === 'all' ? '' : `_${SIDE[state.side].label}`
      document.title = `座位表${tag}_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}`
      window.addEventListener('afterprint', () => {
        document.title = old
        state.q = keepQ
        render()
      }, { once: true })
      window.print()
    }

    function render() { renderMap(); renderList(); renderSummary() }

    const qInput = document.getElementById('q')
    const qClear = document.getElementById('qClear')
    qInput.addEventListener('input', () => {
      state.q = norm(qInput.value)
      qClear.hidden = !qInput.value
      render()
    })
    qClear.addEventListener('click', () => { qInput.value = ''; state.q = ''; qClear.hidden = true; render(); qInput.focus() })
    document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
      state.side = b.dataset.side
      document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
      render()
    }))

    render()
  </script>
</body>

</html>
